<body><div class="top">湿地自然笔记</div><main><h1>候鸟观察手册</h1><p>沿着湖岸寻找迁徙中的雁群。从这份简明手册开始记录你的第一次观鸟。</p><hr><h2>湖岸步道</h2><p>清晨从东侧栈道出发，在芦苇边的观察台停留。与鸟群保持距离，使用望远镜观察。</p><h2>观察记录</h2><p>记下日期、地点、天气和鸟群数量。留意雁群起飞时的队形变化。</p></main></body></html>
